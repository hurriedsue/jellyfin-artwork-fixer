name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build Jellyfin.Plugin.ArtworkFixer/Jellyfin.Plugin.ArtworkFixer.csproj -c Release -o out

      - name: Package
        run: |
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' Jellyfin.Plugin.ArtworkFixer/Jellyfin.Plugin.ArtworkFixer.csproj)
          mkdir pkg
          cp out/Jellyfin.Plugin.ArtworkFixer.dll pkg/
          cat > pkg/meta.json <<EOF
          {
            "category": "General",
            "guid": "8738f582-1c94-405b-9bf5-14b5739f0a00",
            "name": "Artwork Fixer",
            "overview": "Find titles with missing or low-resolution artwork and replace it.",
            "owner": "hurriedsue",
            "targetAbi": "12.0.0.0",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "version": "$VERSION"
          }
          EOF
          (cd pkg && zip -r ../ArtworkFixer_$VERSION.zip .)
          md5sum ArtworkFixer_$VERSION.zip | tee checksum.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ArtworkFixer
          path: |
            ArtworkFixer_*.zip
            checksum.txt

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ArtworkFixer_*.zip
            checksum.txt
