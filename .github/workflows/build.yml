name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build Jellyfin.Plugin.ArtworkFixer/Jellyfin.Plugin.ArtworkFixer.csproj -c Release -o out

      - name: Package
        run: |
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' Jellyfin.Plugin.ArtworkFixer/Jellyfin.Plugin.ArtworkFixer.csproj)
          mkdir pkg
          cp out/Jellyfin.Plugin.ArtworkFixer.dll pkg/
          cat > pkg/meta.json <<EOF
          {
            "category": "General",
            "guid": "8738f582-1c94-405b-9bf5-14b5739f0a00",
            "name": "Artwork Fixer",
            "overview": "Finds movies and shows with missing or low-quality artwork and lets you replace it from one admin-only page.",
            "owner": "hurriedsue",
            "targetAbi": "12.0.0.0",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "version": "$VERSION"
          }
          EOF
          (cd pkg && zip -r ../ArtworkFixer_$VERSION.zip .)
          md5sum ArtworkFixer_$VERSION.zip | tee checksum.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ArtworkFixer
          path: |
            ArtworkFixer_*.zip
            checksum.txt

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ArtworkFixer_*.zip
            checksum.txt

      - name: Add this version to manifest.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' Jellyfin.Plugin.ArtworkFixer/Jellyfin.Plugin.ArtworkFixer.csproj)
          SUM=$(md5sum ArtworkFixer_$VERSION.zip | cut -d' ' -f1)
          git fetch origin main
          git checkout -B main origin/main
          python3 - "$VERSION" "$SUM" "${GITHUB_REF_NAME}" <<'PY'
          import json, sys, datetime
          version, checksum, tag = sys.argv[1:4]
          data = json.load(open("manifest.json"))
          entry = {
              "version": version,
              "changelog": "See the release notes.",
              "targetAbi": "12.0.0.0",
              "sourceUrl": f"https://github.com/${{ github.repository }}/releases/download/{tag}/ArtworkFixer_{version}.zip",
              "checksum": checksum,
              "timestamp": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          versions = [v for v in data[0]["versions"] if v["version"] != version]
          data[0]["versions"] = [entry] + versions
          json.dump(data, open("manifest.json", "w"), indent=2)
          PY
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add manifest.json
          git commit -m "Add $VERSION to manifest" || exit 0
          git push origin main
